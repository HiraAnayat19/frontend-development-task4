<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sound presented by Hira - Music Player</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Ambient Dynamic Background -->
  <div class="ambient-background" id="ambientBg"></div>
  <div class="glass-overlay"></div>

  <div class="app-container">
    
    <!-- Left / Top: Main Player View -->
    <main class="player-card">
      <header class="player-header">
        <div class="brand">
          <i class="fa-solid fa-compact-disc brand-icon"></i>
          <span>sound presented by Hira</span>
        </div>
        <button class="icon-btn tooltip-trigger" id="shortcutBtn" title="Keyboard Shortcuts">
          <i class="fa-solid fa-keyboard"></i>
        </button>
      </header>

      <!-- Track Cover & Visualizer -->
      <div class="cover-wrapper">
        <div class="visualizer-container">
          <canvas id="visualizerCanvas"></canvas>
        </div>
        <div class="album-art-container" id="albumContainer">
          <img src="" alt="Album Art" id="coverImage" class="album-art" />
          <div class="vinyl-center"></div>
        </div>
      </div>

      <!-- Track Info -->
      <div class="track-info">
        <h2 id="songTitle" class="song-title">Select a Song</h2>
        <p id="artistName" class="artist-name">Artist Name</p>
        <span class="genre-badge" id="genreBadge">Pop</span>
      </div>

      <!-- Seek / Progress Bar -->
      <div class="progress-section">
        <div class="time-display">
          <span id="currentTime">0:00</span>
          <span id="totalDuration">0:00</span>
        </div>
        <div class="progress-bar-wrapper" id="progressWrapper">
          <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1" />
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- Main Controls -->
      <div class="controls-section">
        <button class="icon-btn control-secondary" id="shuffleBtn" title="Shuffle">
          <i class="fa-solid fa-shuffle"></i>
        </button>
        <button class="icon-btn control-secondary" id="prevBtn" title="Previous Track">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button class="play-btn" id="playBtn" title="Play/Pause">
          <i class="fa-solid fa-play" id="playIcon"></i>
        </button>
        <button class="icon-btn control-secondary" id="nextBtn" title="Next Track">
          <i class="fa-solid fa-forward-step"></i>
        </button>
        <button class="icon-btn control-secondary" id="repeatBtn" title="Repeat Mode">
          <i class="fa-solid fa-repeat"></i>
        </button>
      </div>

      <!-- Volume Section -->
      <div class="volume-section">
        <button class="icon-btn" id="muteBtn" title="Mute/Unmute">
          <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
        </button>
        <div class="volume-bar-wrapper">
          <input type="range" id="volumeBar" min="0" max="1" value="0.8" step="0.01" />
          <div class="volume-fill" id="volumeFill"></div>
        </div>
        <span class="volume-text" id="volumeText">80%</span>
      </div>
    </main>

    <!-- Right / Bottom: Playlist Sidebar -->
    <aside class="playlist-card">
      <div class="playlist-header">
        <h3><i class="fa-solid fa-list-ul"></i> Playlist (<span id="trackCount">0</span>)</h3>
        <div class="autoplay-toggle-wrapper">
          <label for="autoplayToggle" class="toggle-label">Autoplay</label>
          <input type="checkbox" id="autoplayToggle" class="toggle-checkbox" checked />
        </div>
      </div>

      <!-- Search Box -->
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search song or artist..." />
      </div>

      <!-- Playlist Items Container -->
      <ul class="playlist-items" id="playlistItems">
        <!-- Dynamic playlist items injected via JS -->
      </ul>
    </aside>

  </div>

  <!-- Keyboard Shortcuts Modal -->
  <div class="modal-backdrop" id="shortcutModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-keyboard"></i> Keyboard Shortcuts</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="shortcut-item"><kbd>Space</kbd> <span>Play / Pause</span></div>
        <div class="shortcut-item"><kbd>N</kbd> <span>Next Track</span></div>
        <div class="shortcut-item"><kbd>P</kbd> <span>Previous Track</span></div>
        <div class="shortcut-item"><kbd>→</kbd> <span>Seek Forward 5s</span></div>
        <div class="shortcut-item"><kbd>←</kbd> <span>Seek Backward 5s</span></div>
        <div class="shortcut-item"><kbd>↑</kbd> <span>Volume Up 10%</span></div>
        <div class="shortcut-item"><kbd>↓</kbd> <span>Volume Down 10%</span></div>
        <div class="shortcut-item"><kbd>M</kbd> <span>Mute / Unmute</span></div>
      </div>
    </div>
  </div>

  <audio id="audioPlayer" crossorigin="anonymous"></audio>

  <script src="script.js"></script>
</body>
</html>
